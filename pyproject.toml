[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navlog2fms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pdfplumber>=0.10",
]

[project.scripts]
navlog2fms = "navlog2fms.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["navlog2fms*"]
